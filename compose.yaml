name: brasa
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/init-dev.sh}
      POSTGRES_DB: ${POSTGRES_DB:-brasa}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: src/Brasa.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-brasa};Username=${POSTGRES_USER:-brasa};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${Jwt__Key:?Execute scripts/init-dev.sh}
      Payments__WebhookSecret: ${Payments__WebhookSecret:?Execute scripts/init-dev.sh}
      Demo__Seed: ${Demo__Seed:-false}
      Demo__Password: ${Demo__Password}
      Database__Migrate: "true"
    ports: ["127.0.0.1:5070:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: src/Brasa.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Api__BaseUrl: http://api:8080
      AllowedHosts: localhost;127.0.0.1;web
    ports: ["127.0.0.1:5080:8080"]
    depends_on: [api]
volumes:
  postgres-data:
