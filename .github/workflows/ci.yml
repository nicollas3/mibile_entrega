name: Verificar Brasa
on: [push, pull_request]
jobs:
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_USER: brasa, POSTGRES_PASSWORD: local-development-only, POSTGRES_DB: brasa}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U brasa" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: global.json}
      - run: dotnet tool restore
      - run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: resultados-testes, path: '**/TestResults/*.trx'}
